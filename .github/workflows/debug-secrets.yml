# .github/workflows/debug-secrets.yml
name: Debug Secrets

on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          echo "=== DEBUG SECRETS ==="
          echo "VITE_SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}'"
          echo "VITE_SUPABASE_ANON_KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY }}'"
          echo "URL length: ${{ secrets.VITE_SUPABASE_URL != '' && length(secrets.VITE_SUPABASE_URL) || 'EMPTY' }}"
          echo "KEY length: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && length(secrets.VITE_SUPABASE_ANON_KEY) || 'EMPTY' }}"
          echo "=== END DEBUG ==="
