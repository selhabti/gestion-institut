name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Injecte les variables d'environnement définies dans Settings > Variables.
      # Seules les variables remplies sont exportées => un repo configuré pour
      # un institut n'expose QUE cet institut.
      - name: Inject institut variables
        run: |
          for pair in \
            "VITE_INSTITUT_ZAYED_URL:${{ vars.VITE_INSTITUT_ZAYED_URL }}" \
            "VITE_INSTITUT_ZAYED_ANON_KEY:${{ vars.VITE_INSTITUT_ZAYED_ANON_KEY }}" \
            "VITE_INSTITUT_ATTANZIL_URL:${{ vars.VITE_INSTITUT_ATTANZIL_URL }}" \
            "VITE_INSTITUT_ATTANZIL_ANON_KEY:${{ vars.VITE_INSTITUT_ATTANZIL_ANON_KEY }}" \
            "VITE_SUPABASE_URL:${{ vars.VITE_SUPABASE_URL }}" \
            "VITE_SUPABASE_ANON_KEY:${{ vars.VITE_SUPABASE_ANON_KEY }}" \
          ; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # Base path: à renseigner SEULEMENT si le site est hébergé sous
      # user.github.io/<repo>/. Avec un domaine personnalisé, laisser vide.
      - name: Set Vite base path
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$VITE_BASE_PATH" ]; then
            echo "VITE_BASE_PATH=$VITE_BASE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4