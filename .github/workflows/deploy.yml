name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Injecte les variables d'environnement définies dans Settings > Variables.
      # Seules les variables remplies sont exportées => un repo configuré pour
      # un institut n'expose QUE cet institut.
      - name: Inject institut variables
        run: |
          for pair in \
            "VITE_INSTITUT_ZAYED_URL:${{ vars.VITE_INSTITUT_ZAYED_URL }}" \
            "VITE_INSTITUT_ZAYED_ANON_KEY:${{ vars.VITE_INSTITUT_ZAYED_ANON_KEY }}" \
            "VITE_INSTITUT_ATTANZIL_URL:${{ vars.VITE_INSTITUT_ATTANZIL_URL }}" \
            "VITE_INSTITUT_ATTANZIL_ANON_KEY:${{ vars.VITE_INSTITUT_ATTANZIL_ANON_KEY }}" \
            "VITE_SUPABASE_URL:${{ vars.VITE_SUPABASE_URL }}" \
            "VITE_SUPABASE_ANON_KEY:${{ vars.VITE_SUPABASE_ANON_KEY }}" \
          ; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # Base path: déduit du nom du repo (user.github.io/<repo>/), sauf si la
      # variable VITE_BASE_PATH est définie (ex: "/" pour un domaine perso).
      - name: Set Vite base path
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          DEFAULT_BASE: /${{ github.event.repository.name }}/
        run: |
          echo "VITE_BASE_PATH=${VITE_BASE_PATH:-$DEFAULT_BASE}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Supprime les artefacts "github-pages" restants d'un éventuel re-run
      # (évite l'erreur "Multiple artifacts named github-pages").
      - name: Clean previous Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const toDelete = data.artifacts.filter(a => a.name === 'github-pages');
            for (const artifact of toDelete) {
              console.log(`Suppression de l'artefact ${artifact.name} (id ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4