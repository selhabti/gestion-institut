# .github/workflows/deploy.yml
name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # Permet un déploiement manuel

jobs:
  deploy-staging:
    name: Déploiement Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Installation des dépendances
        run: bun install

      - name: Build pour staging
        run: |
          cp .env.example .env
          echo "VITE_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_APP_URL=${{ secrets.STAGING_APP_URL }}" >> .env
          ./scripts/build.sh

      - name: Déploiement staging
        run: ./scripts/deploy.sh staging
        # Ici vous ajouterez la logique spécifique à votre hébergeur

  deploy-production:
    name: Déploiement Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Installation des dépendances
        run: bun install

      - name: Build pour production
        run: |
          cp .env.example .env
          echo "VITE_SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_APP_URL=${{ secrets.PRODUCTION_APP_URL }}" >> .env
          ./scripts/build.sh

      - name: Déploiement production
        run: ./scripts/deploy.sh production
        # Ici vous ajouterez la logique spécifique à votre hébergeur
