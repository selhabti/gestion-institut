# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Debug des secrets
        run: |
          echo "=== SECRETS DEBUG ==="
          echo "URL exists: ${{ secrets.VITE_SUPABASE_URL != '' }}"
          echo "KEY exists: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}"
          echo "URL preview: ${{ secrets.VITE_SUPABASE_URL }}"
          echo "KEY preview: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"

      - name: Installation des dépendances
        run: bun install

      - name: Configuration de l'environnement
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # NOUVELLE MÉTHODE - utilise les variables env
          cat > .env << EOF
          VITE_SUPABASE_URL=${SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY}
          VITE_APP_URL=https://localhost:5173
          EOF

          echo "=== .env CREATED ==="
          cat .env

      - name: Build de production
        run: ./scripts/build.sh

      - name: Vérification TypeScript
        run: bun run build --type-check

      - name: Analyse du code (ESLint)
        run: bun run lint
