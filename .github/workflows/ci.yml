# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Nettoyage de l'environnement
        run: |
          # Supprime tout fichier .env existant qui aurait pu être commité
          rm -f .env .env.*.local

      - name: Installation des dépendances
        run: bun install

      - name: Configuration de l'environnement
        run: |
          # Crée un NOUVEAU .env avec les secrets GitHub
          cat > .env << EOF
          # Configuration générée automatiquement par GitHub Actions
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL=https://localhost:5173
          NODE_ENV=production
          EOF

          echo "✅ Fichier .env créé avec les secrets GitHub"
          echo "📏 Longueur VITE_SUPABASE_URL: ${#VITE_SUPABASE_URL}"
          echo "📏 Longueur VITE_SUPABASE_ANON_KEY: ${#VITE_SUPABASE_ANON_KEY }"

      - name: Vérification TypeScript
        run: bun run build --type-check

      - name: Analyse du code (ESLint)
        run: bun run lint

      - name: Build de production
        run: ./scripts/build.sh
