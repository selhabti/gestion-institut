name: Keep Supabase Alive

on:
  schedule:
    # Tous les 3 jours à 06:00 UTC
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Attente aléatoire (0-6h) pour éviter un horaire fixe
        run: sleep $((RANDOM % 21600))
        shell: bash

      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/members?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
        shell: bash
