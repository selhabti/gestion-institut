name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Attente aléatoire (0-6h)
        run: sleep $((RANDOM % 21600))

      - name: Ping Supabase (avec relance)
        run: |
          # Seul endpoint fiable : /auth/v1/settings
          URL="${SUPABASE_URL}/auth/v1/settings"
          HEADERS=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Requête : GET ${URL}"

          MAX_RETRIES=3
          DELAY=10

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Tentative $i / $MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL" "${HEADERS[@]}")

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "✅ Succès (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "❌ Échec (HTTP $HTTP_CODE) - tentative $i"
              if [[ $i -lt $MAX_RETRIES ]]; then
                echo "Nouvel essai dans ${DELAY}s..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              fi
            fi
          done

          echo "💥 Toutes les tentatives ont échoué"
          exit 1
