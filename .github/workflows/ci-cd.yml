# .github/workflows/ci-cd.yml - VERSION SIMPLIFIÉE
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Installation des dépendances
        run: bun install

      - name: Configuration de l'environnement
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      - name: Analyse du code (ESLint)
        run: bun run lint

      - name: Build de production
        run: ./scripts/build.sh

  deploy:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Installation des dépendances
        run: bun install

      - name: Build pour la production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: ./scripts/build.sh

      - name: Déploiement
        run: echo "✅ Prêt pour le déploiement - Ajoutez votre commande de déploiement ici"
