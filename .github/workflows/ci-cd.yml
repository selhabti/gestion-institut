# .github/workflows/ci-cd.yml - VERSION DÉBLOQUANTE
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Installation des dépendances
        run: bun install

      - name: Configuration de l'environnement
        run: |
          cat > .env << EOF
          VITE_INSTITUT_ZAYED_AUTH_URL=${{ secrets.VITE_INSTITUT_ZAYED_AUTH_URL }}
          VITE_INSTITUT_ZAYED_DATA_API_URL=${{ secrets.VITE_INSTITUT_ZAYED_DATA_API_URL }}
          VITE_INSTITUT_ATTANZIL_AUTH_URL=${{ secrets.VITE_INSTITUT_ATTANZIL_AUTH_URL }}
          VITE_INSTITUT_ATTANZIL_DATA_API_URL=${{ secrets.VITE_INSTITUT_ATTANZIL_DATA_API_URL }}
          EOF

      - name: Build de production (inclut la vérification TypeScript)
        run: ./scripts/build.sh

  deploy:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Installation des dépendances
        run: bun install

      - name: Build pour la production
        env:
          VITE_INSTITUT_ZAYED_AUTH_URL: ${{ secrets.VITE_INSTITUT_ZAYED_AUTH_URL }}
          VITE_INSTITUT_ZAYED_DATA_API_URL: ${{ secrets.VITE_INSTITUT_ZAYED_DATA_API_URL }}
          VITE_INSTITUT_ATTANZIL_AUTH_URL: ${{ secrets.VITE_INSTITUT_ATTANZIL_AUTH_URL }}
          VITE_INSTITUT_ATTANZIL_DATA_API_URL: ${{ secrets.VITE_INSTITUT_ATTANZIL_DATA_API_URL }}
        run: ./scripts/build.sh

      - name: Déploiement
        run: echo "✅ Prêt pour le déploiement"
