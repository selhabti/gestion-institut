# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permet de déclencher manuellement

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install

      - name: Configuration de l'environnement
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL=https://localhost:5173
          EOF

      - name: Vérification TypeScript
        run: bun run build --type-check

      - name: Analyse du code (ESLint)
        run: bun run lint

      - name: Build de production
        run: ./scripts/build.sh

  deploy:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: test # Attend que les tests passent
    if: github.ref == 'refs/heads/main' # Seulement sur la branche main

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Installation des dépendances
        run: bun install

      - name: Configuration pour la production
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL=https://votre-app-production.com
          EOF

      - name: Build pour la production
        run: ./scripts/build.sh

      - name: Déploiement
        run: echo "🚀 ICI VOUS AJOUTEREZ LA COMMANDE DE DÉPLOIEMENT"
        # Exemple pour Netlify: npx netlify-cli deploy --prod --dir=dist
        # Exemple pour GitHub Pages: npx gh-pages -d dist
